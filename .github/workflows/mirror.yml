name: Mirror Repo

on:
  push:
    branches:
      - '*'
    tags:
      - '*'

env:
  DEST_USER: mkelly
  DEST_HOST: git.sr.ht

jobs:
  mirror_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CODE_AUTOMATION }}

      # Add destination to known_hosts to prevent interactive prompts
      - name: Set known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${DEST_HOST} >> ~/.ssh/known_hosts

      - name: Clone Source Repository Bare
        run: git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo_mirror

      - name: Push Mirror to Target
        run: |
          cd repo_mirror
          git push --mirror "git@${DEST_HOST}:~${DEST_USER}/${{ github.event.repository.name }}"

