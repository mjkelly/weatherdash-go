name: Mirror Repo

on:
  push:
    branches:
      - '*'
    tags:
      - '*'

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs.
concurrency:
  group: "${{ github.repository }}:${{ github.workflow }}"
  cancel-in-progress: false

env:
  DEST_USER: mkelly
  DEST_HOST: git.sr.ht

jobs:
  mirror_repo:
    runs-on: ubuntu-latest
    steps:
      # Set up ssh agent
      - name: Set Up SSH Key and Agent
        env:
          SSH_KEY: ${{ secrets.CODE_AUTOMATION }}
        run: |
          eval $(ssh-agent -s)
          # The tr newline is some paranoia in case the key came from windows
          # and contains CR+LF line endings.
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -
          # Required so later steps can connect to the agent
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      # Add destination to known_hosts to prevent interactive prompts
      - name: Update known_hosts
        run: |
          umask 077
          mkdir -p ~/.ssh
          ssh-keyscan ${DEST_HOST} >> ~/.ssh/known_hosts

      - name: Clone Source Repository
        run: git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo_mirror

      - name: Push Mirror to Target
        run: |
          cd repo_mirror
          git push --mirror "git@${DEST_HOST}:~${DEST_USER}/${{ github.event.repository.name }}"

